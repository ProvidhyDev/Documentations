name: docs-watch
# GitHub-native docs watcher. Detects production-branch moves in tracked service repos, runs the
# headless agent (Codex CLI + hosted qwen3.8-27B, OpenAI route) with docs-agent/PLAYBOOK.md,
# and opens a docs PR. Secrets: MODEL_KEY, DOCS_SYNC_TOKEN.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-shas:
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.shas.outputs.moved }}
    steps:
      - uses: actions/checkout@v4
      - id: shas
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          node -e '
          (async () => {
            const fs = require("fs");
            const st = JSON.parse(fs.readFileSync("./.docs-state.json", "utf8"));
            const moved = [];
            for (const [repo, e] of Object.entries(st.repos)) {
              const r = await fetch("https://api.github.com/repos/" + repo + "/branches/" + e.branch,
                { headers: { Authorization: "Bearer " + process.env.GH_TOKEN, "User-Agent": "docs-watch" } });
              if (!r.ok) { console.log("WARN " + repo + " unreadable (" + r.status + ")"); continue; }
              const cur = (await r.json()).commit.sha;
              if (!cur.startsWith(e.sha)) moved.push(repo);
            }
            const m = moved.length ? moved.join(",") : "none";
            console.log("moved=" + m);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "moved=" + m + "\n");
          })().catch(e => { console.error(e); process.exit(1); });
          '
  sync-docs:
    needs: check-shas
    if: needs.check-shas.outputs.moved != '' && needs.check-shas.outputs.moved != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone tracked service repos (production branch, read-only)
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          node -e '
          const { execSync } = require("child_process");
          const fs = require("fs");
          const st = JSON.parse(fs.readFileSync("./.docs-state.json", "utf8"));
          for (const [repo, e] of Object.entries(st.repos)) {
            const name = repo.split("/")[1];
            execSync("git clone --branch " + e.branch + " --depth 50 https://x:" + process.env.GH_TOKEN + "@github.com/" + repo + ".git /src/" + name, { stdio: "inherit" });
          }
          '
      - name: Install Codex CLI
        run: npm install -g @openai/codex
      - name: Run the agent - execute docs-agent/PLAYBOOK.md (PR mode, Codex)
        env:
          MODEL_KEY: ${{ secrets.MODEL_KEY }}
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          mkdir -p "$HOME/.codex"
          {
          echo 'model = "qwen3.8-27B"'
          echo 'model_provider = "providhy"'
          echo ''
          echo '[model_providers.providhy]'
          echo 'name = "Providhy hosted"'
          echo 'base_url = "https://ai-gw.f1arl.com/v1"'
          echo 'env_key = "MODEL_KEY"'
          echo 'wire_api = "responses"'
          } > "$HOME/.codex/config.toml"
          codex exec --dangerously-bypass-approvals-and-sandbox "You are the docs-sync agent. Read docs-agent/PLAYBOOK.md and execute it completely. The tracked service repos are cloned under /src/<RepoName>/ - treat those as the local checkouts named in the playbook (map by repo name). Because this is a headless CI run, use PR MODE for section 2.6: branch docs-sync-<YYYYMMDD-HHMM>, push it, and open a PR to main with the acceptance report as the PR body. Do NOT push directly to main. If no repos moved, say so and stop. Service repos under /src are READ-ONLY."
      - name: Watch the PR
        run: echo 'Review the opened PR in the PRs tab; merging it deploys the site via pages.yml'
