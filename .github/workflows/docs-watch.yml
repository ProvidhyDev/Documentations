name: docs-watch
# GitHub-native docs watcher. Detects production-branch moves in tracked service repos, runs the
# headless agent (qwen3.8-27B via ai-gw.f1arl.com through Claude Code) with docs-agent/PLAYBOOK.md,
# and opens a docs PR. Verified 2026-11-04: endpoint speaks OpenAI + Anthropic formats; effort must
# be medium (gateway rejects 'high'). Secrets: MODEL_KEY, DOCS_SYNC_TOKEN.
permissions:
  contents: write

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  check-shas:
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.shas.outputs.moved }}
    steps:
      - uses: actions/checkout@v4
      - id: shas
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          node -e '
          (async () => {
            const fs = require("fs");
            const st = JSON.parse(fs.readFileSync("./.docs-state.json", "utf8"));
            const moved = [];
            for (const [repo, e] of Object.entries(st.repos)) {
              const r = await fetch("https://api.github.com/repos/" + repo + "/branches/" + e.branch,
                { headers: { Authorization: "Bearer " + process.env.GH_TOKEN, "User-Agent": "docs-watch" } });
              if (!r.ok) { console.log("WARN " + repo + " unreadable (" + r.status + ")"); continue; }
              const cur = (await r.json()).commit.sha;
              if (!cur.startsWith(e.sha)) moved.push(repo);
            }
            const m = moved.length ? moved.join(",") : "none";
            console.log("moved=" + m);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "moved=" + m + "\n");
          })().catch(e => { console.error(e); process.exit(1); });
          '
  sync-docs:
    needs: check-shas
    if: needs.check-shas.outputs.moved != '' && needs.check-shas.outputs.moved != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone tracked service repos (production branch, read-only)
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          node -e '
          const { execSync } = require("child_process");
          const fs = require("fs");
          const st = JSON.parse(fs.readFileSync("./.docs-state.json", "utf8"));
          for (const [repo, e] of Object.entries(st.repos)) {
            const name = repo.split("/")[1];
            execSync("git clone --branch " + e.branch + " --depth 50 https://x:" + process.env.GH_TOKEN + "@github.com/" + repo + ".git /src/" + name, { stdio: "inherit" });
          }
          '
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the agent - execute docs-agent/PLAYBOOK.md (PR mode)
        env:
          ANTHROPIC_BASE_URL: "https://ai-gw.f1arl.com"
          ANTHROPIC_API_KEY: ${{ secrets.MODEL_KEY }}
          ANTHROPIC_MODEL: qwen3.8-27B
          ANTHROPIC_SMALL_FAST_MODEL: qwen3.8-27B
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          claude -p "You are the docs-sync agent. Read docs-agent/PLAYBOOK.md and execute it completely. The tracked service repos are cloned under /src/<RepoName>/ - treat those as the local checkouts named in the playbook (map by repo name). Because this is a headless CI run, use PR MODE for section 2.6: branch docs-sync-<YYYYMMDD-HHMM>, push it, and open a PR to main with the acceptance report as the PR body. Do NOT push directly to main. If no repos moved, say so and stop. Service repos under /src are READ-ONLY." --dangerously-skip-permissions --effort medium
      - name: Watch the PR
        run: echo 'Review the opened PR in the PRs tab; merging it deploys the site via pages.yml'
